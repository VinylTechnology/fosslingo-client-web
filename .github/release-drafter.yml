name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - feature
      - enhancement
  patch:
    labels:
      - fix
      - bugfix
      - bug
      - chore
  default: patch

categories:
  - title: '🚀 Features'
    labels:
      - feature
      - enhancement

  - title: '🐛 Bug Fixes'
    labels:
      - fix
      - bugfix
      - bug

  - title: '🧰 Maintenance'
    labels:
      - chore

  - title: '⏭️ Excluded from changelog'
    labels:
      - skip-changelog
    exclude: true

change-template: '- $TITLE (#$NUMBER) $AUTHORS'

change-title-escapes: '\<*_&'

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
